# ==============================
# PROFILE
# ==============================
spring.profiles.active=social

# ==============================
# SERVER
# ==============================
server.port=${PORT:8080}

# ==============================
# DATABASE
# ==============================
spring.datasource.url=${MYSQL_URL}
spring.datasource.username=${MYSQLUSER}
spring.datasource.password=${MYSQLPASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==============================
# JPA
# ==============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# ==============================
# JWT
# ==============================
jwt.secret=${JWT_SECRET}

# ==============================
# BREVO
# ==============================
BREVO_API_KEY=${BREVO_API_KEY}

# ==============================
# SPRING AI (FIXED)
# ==============================
spring.ai.vertex.ai.gemini.api-key=${AI_API_Key}
spring.ai.vertex.ai.gemini.project-id=${VERTEX_PROJECT_ID}
spring.ai.vertex.ai.gemini.location=us-central1
spring.ai.vertex.ai.gemini.chat.options.model=gemini-1.5-flash
spring.ai.vertex.ai.gemini.transport=REST