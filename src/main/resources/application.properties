# 1. PROFILE SETTINGS
spring.profiles.active=social

# 2. DATABASE CONNECTION
# This uses the Railway environment variables
# Note: jdbc:mysql:// is required for the Java driver
spring.datasource.url=jdbc:mysql://${MYSQL_URL}
spring.datasource.username=${MYSQLUSER}
spring.datasource.password=${MYSQLPASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# 3. HIKARI CONNECTION POOL (To prevent timeouts)
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# 4. JPA / HIBERNATE SETTINGS
spring.jpa.show-sql=true

# FIXED: Changed 'auto' to 'update' so Hibernate can create your tables
spring.jpa.hibernate.ddl-auto=update

# Removed the deprecated MySQL8Dialect line - Spring Boot 3 detects it automatically
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# 5. SECURITY / JWT CONFIG
# Ensure JWT_SECRET is at least 32 characters long in Railway/IntelliJ variables
jwt.secret=${JWT_SECRET}
# Add this to your existing application.properties
spring.datasource.hikari.initialization-fail-timeout=1
