# ==============================
# PROFILE
# ==============================
spring.profiles.active=social

# ==============================
# SERVER
# ==============================
server.port=${PORT:8080}

# ==============================
# DATABASE
# ==============================
# Uses Railway environment variable in production, falls back to public proxy link locally
spring.datasource.url=${MYSQL_URL}?useSSL=true&requireSSL=true
spring.datasource.username=${MYSQLUSER}
spring.datasource.password=${MYSQLPASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==============================
# JPA
# ============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# ==============================
# JWT
# ==============================
# Resolves the boot crash by giving a safe, 256-bit plain text fallback key for local dev
jwt.secret=${JWT_SECRET}

# ==============================
# BREVO
# ==============================
BREVO_API_KEY=${BREVO_API_KEY}

# ==============================
# GOOGLE GEMINI AI CONFIGURATION
# ==============================
spring.ai.google.genai.api-key=${AI_API_Key}
spring.ai.google.genai.chat.options.model=gemini-1.5-flash

# ==============================
# ADVANCED CONFIG
# ==============================
spring.main.allow-circular-references=true

# Safety timeout configurations to prevent long hangs
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=5
