# ===================================================================
# 1. PROFILE SETTINGS
# ===================================================================
spring.profiles.active=social

# ===================================================================
# 2. APPLICATION NETWORK PORT CONFIGURATION
# ===================================================================
# CRITICAL FIX: Binds Spring Boot dynamically to Railway's allocated port.
# Falls back to 8080 during local offline development.
server.port=${PORT:8080}

# ===================================================================
# 3. PRODUCTION DATABASE CONNECTION (Railway Infrastructure)
# ===================================================================
# Automatically maps to your provisioned MySQL instances via injected environment vars
spring.datasource.url=${MYSQL_URL}
spring.datasource.username=${MYSQLUSER}
spring.datasource.password=${MYSQLPASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===================================================================
# 4. HIKARI CONNECTION POOL SETTINGS
# ===================================================================
# Keeps data transactions active and prevents premature platform drops/timeouts
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.initialization-fail-timeout=1

# ===================================================================
# 5. JPA / HIBERNATE ORM ENGINE MANAGEMENT
# ===================================================================
# CRITICAL FIX: 'update' forces Hibernate to safely create missing tables
# (like verificationotp) on startup instead of crashing the server context.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Spring Boot 3 automatically resolves dialects. Explicit definition acts as fallback.
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# ===================================================================
# 6. SECURITY & ENCRYPTION KEYS
# ===================================================================
# Maps token signing values from your Railway system deployment settings console
jwt.secret=${JWT_SECRET}

# ===================================================================
# 7. GOOGLE SMTP MAIL TRANSMISSION ENGINE
# ===================================================================
# Controls email transmissions to send verification OTP tokens out to your platform clients
spring.mail.host=gmail.com
spring.mail.port=587
spring.mail.username=${EMAIL_USERNAME}
spring.mail.password=${APP_PASSWORD_EMAIL}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
