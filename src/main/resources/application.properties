# ===================================================================
# 1. PROFILE SETTINGS
# ===================================================================
spring.profiles.active=social

# ===================================================================
# 2. APPLICATION NETWORK PORT CONFIGURATION
# ===================================================================
# Critical for Railway to keep the container alive
server.port=${PORT:8080}

# ===================================================================
# 3. DATABASE CONNECTION (Railway MySQL)
# ===================================================================
spring.datasource.url=${MYSQL_URL}
spring.datasource.username=${MYSQLUSER}
spring.datasource.password=${MYSQLPASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===================================================================
# 4. HIKARI CONNECTION POOL MANAGEMENT
# ===================================================================
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.initialization-fail-timeout=1

# ===================================================================
# 5. JPA / HIBERNATE ORM SETTINGS
# ===================================================================
# 'update' automatically creates your 'verificationotp' table
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# ===================================================================
# 6. SECURITY MANAGEMENT
# ===================================================================
jwt.secret=${JWT_SECRET}

# ===================================================================
# 7. BREVO API CONFIGURATION (HTTP METHOD)
# ===================================================================
# IMPORTANT: Delete all 'spring.mail' lines.
# We only need the API Key because we are using the Brevo SDK.
BREVO_API_KEY=${BREVO_API_KEY}
