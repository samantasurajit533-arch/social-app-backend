# ===================================================================
# 1. PROFILE SETTINGS
# ===================================================================
spring.profiles.active=social

# ===================================================================
# 2. APPLICATION NETWORK PORT CONFIGURATION
# ===================================================================
# REQUIRED FIX: Tells Spring to bind directly to Railway's assigned container port
server.port=${PORT:8080}

# ===================================================================
# 3. DATABASE CONNECTION (Railway Infrastructure Mapping)
# ===================================================================
spring.datasource.url=${MYSQL_URL}
spring.datasource.username=${MYSQLUSER}
spring.datasource.password=${MYSQLPASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===================================================================
# 4. HIKARI CONNECTION POOL MANAGEMENT
# ===================================================================
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.initialization-fail-timeout=1

# ===================================================================
# 5. JPA / HIBERNATE ORM SETTINGS
# ===================================================================
# REQUIRED FIX: Forces automated generation of missing schemas like 'verificationotp'
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# ===================================================================
# 6. SECURITY MANAGEMENT
# ===================================================================
jwt.secret=${JWT_SECRET}

# ===================================================================
# 7. GOOGLE SMTP MAIL TRANSMISSION ENGINE
# ===================================================================
# FIXED: Changed 'gmail.com' to 'smtp.gmail.com' to prevent initialization failure
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${EMAIL_USERNAME}
spring.mail.password=${APP_PASSWORD_EMAIL}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
