# 1. PROFILE SETTINGS
spring.profiles.active=social

# 2. DATABASE CONNECTION
# This uses the Railway environment variables
# Note: jdbc:mysql:// is required for the Java driver
spring.datasource.url=${MYSQL_URL}

spring.datasource.username=${MYSQLUSER}
spring.datasource.password=${MYSQLPASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# 3. HIKARI CONNECTION POOL (To prevent timeouts)
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# 4. JPA / HIBERNATE SETTINGS
spring.jpa.show-sql=true

# FIXED: Changed 'auto' to 'update' so Hibernate can create your tables
spring.jpa.hibernate.ddl-auto=validate

# Removed the deprecated MySQL8Dialect line - Spring Boot 3 detects it automatically
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# 5. SECURITY / JWT CONFIG
# Ensure JWT_SECRET is at least 32 characters long in Railway/IntelliJ variables
jwt.secret=${JWT_SECRET}
# Add this to your existing application.properties
spring.datasource.hikari.initialization-fail-timeout=1


# 1. The main address for Google's SMTP email server
spring.mail.host=smtp.gmail.com

# 2. The standard, secure network port used for TLS email transfer
spring.mail.port=587

# 3. REPLACE THIS: Put your exact personal Gmail address here
spring.mail.username=${EMAIL_USERNAME}

# 4. REPLACE THIS: Paste the 16-character App Password here (with NO spaces)
spring.mail.password=${APP_PASSWORD_EMAIL}

# 5. Tells Spring Boot that this connection requires explicit username/password verification
spring.mail.properties.mail.smtp.auth=true

# 6. Forces the connection to use TLS encryption so your email contents are secure
spring.mail.properties.mail.smtp.starttls.enable=true

