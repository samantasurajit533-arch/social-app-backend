# ===================================================================
# 1. PROFILE SETTINGS
# ===================================================================
spring.profiles.active=social

# ===================================================================
# 2. APPLICATION NETWORK PORT CONFIGURATION
# ===================================================================
# Maps to Railway's dynamic port. Critical to keep the server online.
server.port=${PORT:8080}

# ===================================================================
# 3. DATABASE CONNECTION (Railway Infrastructure)
# ===================================================================
spring.datasource.url=${MYSQL_URL}
spring.datasource.username=${MYSQLUSER}
spring.datasource.password=${MYSQLPASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===================================================================
# 4. HIKARI CONNECTION POOL MANAGEMENT
# ===================================================================
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.initialization-fail-timeout=1

# ===================================================================
# 5. JPA / HIBERNATE ORM SETTINGS
# ===================================================================
# 'update' automatically creates missing tables like 'verificationotp'
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# ===================================================================
# 6. SECURITY MANAGEMENT
# ===================================================================
jwt.secret=${JWT_SECRET}

# ===================================================================
# ===================================================================
# 7. GOOGLE SMTP MAIL ENGINE (RAILWAY CLOUD OPTIMIZED)
# ===================================================================
spring.mail.host=smtp.gmail.com
spring.mail.port=2525
spring.mail.username=${EMAIL_USERNAME}
spring.mail.password=${APP_PASSWORD_EMAIL}

# Force Spring to use SSL and the correct SocketFactory for Port 465
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.ssl.enable=true
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com
spring.mail.properties.mail.smtp.socketFactory.port=465
spring.mail.properties.mail.smtp.socketFactory.class=javax.net.ssl.SSLSocketFactory
spring.mail.properties.mail.smtp.socketFactory.fallback=false
spring.mail.properties.mail.smtp.starttls.enable=false
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
